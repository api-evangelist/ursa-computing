name: Ursa Computing
description: 'Ursa Computing was a startup founded in 2020 by Wes McKinney (creator of pandas,
  co-creator of Apache Arrow) to accelerate Apache Arrow and open source data science tooling,
  backed by GV. In late 2021 Ursa Computing and Ursa Labs joined forces with other teams to
  form Voltron Data, and the company no longer operates independently: ursacomputing.com no
  longer resolves, and its remaining public footprint is the ursacomputing GitHub organization,
  whose crossbow repository still runs extra CI for Apache Arrow. No public API surface was
  ever published under the Ursa Computing name.'
